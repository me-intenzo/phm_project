# PHM-XAI experiment configuration — FD004
#
# The hardest subset: 248 training engines, six operating conditions and two
# fault modes.  It justifies the widest model and the strongest noise
# augmentation in the suite.

dataset: FD004

# ------------------------------------------------------------------ data
window_size: 40
max_rul: 125

# ------------------------------------------------------------------ model
model: gru_att_deg_v2
hidden_size: 160
num_layers: 2
dropout: 0.35
num_heads: 4
use_layer_norm: true

# ------------------------------------------------------------------ optimisation
batch_size: 256
epochs: 150
learning_rate: 0.0003
optimizer: AdamW
weight_decay: 0.0001
scheduler: cosine
warmup_epochs: 5
min_lr: 0.000001
patience: 30
grad_clip: 1.0
ema_decay: 0.995

# ------------------------------------------------------------------ loss
rul_loss_type: mse
rul_loss_weight: 1.0
hi_loss_weight: 0.4
scale_loss_weight: 0.1

# ------------------------------------------------------------------ augmentation
# FD004 is the only subset where augmentation helped in the ablation
# (RUL RMSE 14.83 -> 14.37).  Mild magnitudes are used: the full-strength
# recipe was too aggressive even here.
augment: true
aug_noise_std: 0.01
aug_bias_std: 0.02
aug_gain_std: 0.01
aug_sensor_dropout: 0.02
aug_time_mask_prob: 0.05
aug_time_mask_len: 4
aug_history_crop: 4

# ------------------------------------------------------------------ runtime
random_seed: 42
device: cuda
